services:
  dcpcheck:
    build: .
    image: dcpcheck-web:latest
    # Rebuild the image on every start, so that an update of the files is
    # picked up (Container Manager would otherwise reuse the old image).
    pull_policy: build
    container_name: dcpcheck
    ports:
      - "8080:8080"
    volumes:
      # The folder holding your DCPs. Read-only: dcpcheck never writes there.
      - /volume1/DCP:/dcp:ro
      # Results, logs and HTML reports.
      - ./data:/data
    # Uncomment `environment:` along with the variables you need.
    # environment:
      # Optional: run as your NAS user (see README).
      # - PUID=1026
      # - PGID=100
      # Optional: extra options passed to dcpomatic2_verify_cli.
      # - VERIFY_ARGS=--no-asset-hash-check
      # Optional: your servers, to check that KDMs are made for them (see README).
      # - "KDM_SERVERS=Salle 1=SM.ws-123456.DOREMI.DCP2000; Salle 2=SM.ws-654321.DOREMI.DCP2000"
    restart: unless-stopped
